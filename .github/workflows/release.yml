# Builds Spelunk.app + DMG on a Mac runner and attaches it to a GitHub Release.
#
# Release a new version:
#   1. bump __version__ in spelunk/__init__.py (and pyproject.toml)
#   2. git tag v0.1.0 && git push origin v0.1.0
#
# Optional signing + notarization (removes the "unidentified developer" warning).
# Add these repository secrets (Settings > Secrets and variables > Actions):
#   MACOS_CERT_P12        base64 of your "Developer ID Application" certificate (.p12)
#   MACOS_CERT_PASSWORD   password of that .p12
#   CODESIGN_IDENTITY     e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID              Apple ID email used for notarization
#   APPLE_TEAM_ID         10-character team ID
#   APPLE_APP_PASSWORD    app-specific password from appleid.apple.com
# Without them the app is ad-hoc signed and users approve it once in
# System Settings > Privacy & Security > Open Anyway.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest  # Apple silicon (arm64)
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install pytest==8.3.3
          python -m pytest -q

      - name: Import Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build Spelunk.app and DMG
        env:
          PYTHON: python
          CODESIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.CODESIGN_IDENTITY || '-' }}
        run: packaging/build_app.sh

      - name: Notarize DMG
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: Spelunk-macos-arm64
          path: dist/*.dmg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Spelunk $GITHUB_REF_NAME" --generate-notes
          fi
